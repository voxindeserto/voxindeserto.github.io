colorScheme = "ocean"
defaultAppearance = "light"
autoSwitchAppearance = false
enableA11y = true
enableSearch = true
enableCodeCopy = true
enableStructuredBreadcrumbs = true
mainSections = ["blog"]
customCSS = ["css/custom.css"]
defaultBackgroundImage = "img/london-oratory.jpg"
backgroundCanvas = true

[header]
  layout = "fixed"
  mobileMenuStyle = "dropdown"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "landing"
  homepageImage = "img/london-oratory.jpg"
  showRecent = true
  showRecentItems = 3
  showMoreLink = true
  showMoreLinkDest = "blog"
  cardView = true

[article]
  showDate = true
  showAuthor = true
  showHero = false
  showBreadcrumbs = true
  showReadingTime = true
  showTableOfContents = true
  showRelatedContent = true
  relatedContentLimit = 3
  showTaxonomies = true
  showWordCount = false
  showZenMode = true
  sharingLinks = ["email", "line"]

[list]
  showHero = true
  showBreadcrumbs = true
  showSummary = true
  showCards = true
  cardView = true
  groupByYear = true
